<script>
  let currentLanguage = 'ko';

  function toggleLanguage(lang, ev) {
    currentLanguage = lang;
    document.querySelectorAll('.language-button').forEach(btn => btn.classList.remove('active'));
    if (ev && ev.target) ev.target.classList.add('active');

    
  if (lang === 'ko') {
      document.getElementById('korean-content').classList.remove('hidden');
      document.getElementById('english-content').classList.add('hidden');
      document.getElementById('gameTitle').textContent = '오목: 둘이 대결';
      document.getElementById('banner-ko').style.display = 'block';
      document.getElementById('banner-en').style.display = 'none';
    } else {
      document.getElementById('korean-content').classList.add('hidden');
      document.getElementById('english-content').classList.remove('hidden');
      document.getElementById('gameTitle').textContent = 'OMOK: Two Players';
      document.getElementById('banner-ko').style.display = 'none';
      document.getElementById('banner-en').style.display = 'block';
    }

    if (game) game.updateDisplayLanguage();
  }
function initLanguage() {
  const saved = localStorage.getItem('soosoo-lang');
  if (saved) {
    toggleLanguage(saved); // 저장된 값 우선
  } else {
    const lang = navigator.language.startsWith('ko') ? 'ko' : 'en';
    toggleLanguage(lang); // 브라우저 언어 감지
  }
}
  class OmokPvP {
    constructor() {
      this.boardSize = 15;
      this.board = Array.from({length: this.boardSize}, () => Array(this.boardSize).fill(0));
      this.currentPlayer = 1; // 1: 흑돌, 2: 백돌
      this.gameOver = false;
      this.moveHistory = [];
      this.initBoard();
      this.updateDisplayLanguage();
    }

    initBoard() {
      const boardElement = document.getElementById('board');
      boardElement.innerHTML = '';

      const boardSizePx = Math.min(420, window.innerWidth * 0.9);
      const cellSize = boardSizePx / 16; // 패딩 포함 16간격
      const padding = cellSize;

      boardElement.style.width = boardSizePx + 'px';
      boardElement.style.height = boardSizePx + 'px';

      // 선
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', boardSizePx);
      svg.setAttribute('height', boardSizePx);
      svg.setAttribute('class', 'board-lines');

      for (let i = 0; i < this.boardSize; i++) {
        const x = padding + i * cellSize;
        const v = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        v.setAttribute('x1', x); v.setAttribute('y1', padding);
        v.setAttribute('x2', x); v.setAttribute('y2', boardSizePx - padding);
        v.setAttribute('stroke', '#8b4513'); v.setAttribute('stroke-width', '1');
        svg.appendChild(v);

        const y = padding + i * cellSize;
        const h = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        h.setAttribute('x1', padding); h.setAttribute('y1', y);
        h.setAttribute('x2', boardSizePx - padding); h.setAttribute('y2', y);
        h.setAttribute('stroke', '#8b4513'); h.setAttribute('stroke-width', '1');
        svg.appendChild(h);
      }

      // 화점
      [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([r,c])=>{
        const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
        circle.setAttribute('cx', padding + c*cellSize);
        circle.setAttribute('cy', padding + r*cellSize);
        circle.setAttribute('r', Math.max(2, cellSize*0.08));
        circle.setAttribute('fill', '#8b4513');
        svg.appendChild(circle);
      });

      boardElement.appendChild(svg);

      // 클릭 영역
      for (let row=0; row<this.boardSize; row++){
        for (let col=0; col<this.boardSize; col++){
          const node = document.createElement('div');
          node.className = 'intersection';
          node.dataset.row = row;
          node.dataset.col = col;

          const isz = Math.min(24, window.innerWidth*0.06);
          node.style.width = isz + 'px';
          node.style.height = isz + 'px';
          node.style.left = (padding + col*cellSize - isz/2) + 'px';
          node.style.top  = (padding + row*cellSize - isz/2) + 'px';

          node.addEventListener('click', () => this.place(row, col));
          boardElement.appendChild(node);
        }
      }
    }

    place(row, col){
      if (this.gameOver || this.board[row][col] !== 0) return;

      this.board[row][col] = this.currentPlayer;
      this.moveHistory.push({row, col, player: this.currentPlayer});
      this.drawStone(row, col);

      if (this.checkWin(row, col)) {
        this.endGame();
        return;
      }

      this.currentPlayer = (this.currentPlayer === 1) ? 2 : 1;
      this.updateDisplayLanguage();
    }

    drawStone(row, col){
      const intersection = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
      const stone = document.createElement('div');
      const stoneSize = Math.min(20, window.innerWidth * 0.05);
      stone.className = `stone ${this.board[row][col] === 1 ? 'black' : 'white'}`;
      stone.style.width = stoneSize + 'px';
      stone.style.height = stoneSize + 'px';
      intersection.appendChild(stone);
    }

    checkWin(row, col){
      const dirs = [[0,1],[1,0],[1,1],[1,-1]];
      const p = this.board[row][col];

      for (const [dx,dy] of dirs){
        let count = 1;

        for (let i=1;i<5;i++){
          const r = row + dx*i, c = col + dy*i;
          if (r<0||r>=this.boardSize||c<0||c>=this.boardSize||this.board[r][c]!==p) break;
          count++;
        }
        for (let i=1;i<5;i++){
          const r = row - dx*i, c = col - dy*i;
          if (r<0||r>=this.boardSize||c<0||c>=this.boardSize||this.board[r][c]!==p) break;
          count++;
        }
        if (count>=5) return true;
      }
      return false;
    }

    endGame(){
      this.gameOver = true;
      
      // 현재 플레이어 표시 숨기기
      document.querySelectorAll('.game-info').forEach(el => el.style.display = 'none');
      
      const winnerEl = document.getElementById('winner');
      const isBlack = this.currentPlayer === 1;
      if (currentLanguage === 'ko') {
        winnerEl.textContent = `🎉 ${isBlack ? '흑돌' : '백돌'} 승리! 🎉`;
      } else {
        winnerEl.textContent = `🎉 ${isBlack ? 'Black' : 'White'} wins! 🎉`;
      }
      winnerEl.className = `winner ${isBlack ? 'black-wins' : 'white-wins'}`;
      winnerEl.style.display = 'block';
      
      // 3초 후 자동으로 리셋
      setTimeout(() => {
        this.reset();
      }, 3000);
    }

    undo(){
      if (this.moveHistory.length === 0) return;

      // 게임 끝났어도 무르기 가능: 메시지만 가림
      document.getElementById('winner').style.display = 'none';
      
      // 현재 플레이어 표시 다시 보이기
      document.querySelectorAll('.game-info').forEach(el => el.style.display = 'block');

      const last = this.moveHistory.pop();
      this.board[last.row][last.col] = 0;

      const intersection = document.querySelector(`[data-row="${last.row}"][data-col="${last.col}"]`);
      const stone = intersection.querySelector('.stone');
      if (stone) stone.remove();

      this.gameOver = false;
      this.currentPlayer = last.player; // 방금 둔 쪽의 차례로 복귀
      this.updateDisplayLanguage();
    }

    updateDisplayLanguage(){
      if (currentLanguage === 'ko'){
        const indicator = document.querySelector('#korean-content .player-indicator');
        const el = document.getElementById('currentPlayerText-ko');
        if (el && indicator){
          if (this.currentPlayer === 1){
            el.textContent = '흑돌 차례';
            indicator.className = 'player-indicator black';
          } else {
            el.textContent = '백돌 차례';
            indicator.className = 'player-indicator white';
          }
        }
      } else {
        const indicator = document.querySelector('#english-content .player-indicator');
        const el = document.getElementById('currentPlayerText-en');
        if (el && indicator){
          if (this.currentPlayer === 1){
            el.textContent = 'Black to move';
            indicator.className = 'player-indicator black';
          } else {
            el.textContent = 'White to move';
            indicator.className = 'player-indicator white';
          }
        }
      }
    }

    reset(){
      this.board = Array.from({length: this.boardSize}, () => Array(this.boardSize).fill(0));
      this.currentPlayer = 1;
      this.gameOver = false;
      this.moveHistory = [];
      
      const winnerEl = document.getElementById('winner');
      winnerEl.style.display = 'none';
      winnerEl.textContent = '';
      winnerEl.className = 'winner';
      
      // 현재 플레이어 표시 다시 보이기
      document.querySelectorAll('.game-info').forEach(el => el.style.display = 'block');
      
      this.initBoard();
      this.updateDisplayLanguage();
    }
  }

  let game;

  function resetGame(){ game = new OmokPvP(); }
  function undoMove(){ if (game) game.undo(); }

  window.addEventListener('resize', () => {
    if (!game) return;
    game.initBoard();
    // 기존 돌 다시 그림
    for (let r=0;r<game.boardSize;r++){
      for (let c=0;c<game.boardSize;c++){
        if (game.board[r][c]!==0) game.drawStone(r,c);
      }
    }
  });

  window.addEventListener('load', () => { game = new OmokPvP(); });
</script>
